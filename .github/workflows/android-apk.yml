name: Android prototype APK
on:
  push:
    branches: [arena/f91c7577-ai-assistant-wereable-cap-for]
  workflow_dispatch:
permissions:
  contents: write
  checks: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backend unit tests (mocked SMS and model providers)
        run: |
          python -m pip install -r backend/requirements.txt
          PYTHONPATH=backend python -m pytest backend/tests -q
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate Android platform and resolve dependencies
        run: bash tools/bootstrap_android.sh
      - name: Analyze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          flutter analyze --no-fatal-infos > analysis.txt 2>&1
          result=$?
          cat analysis.txt
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Flutter analysis diagnostics" -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=neutral \
            -f 'output[title]=Flutter analysis' -f "output[summary]=$(tail -c 50000 analysis.txt)"
          exit "$result"
      - name: Unit and widget tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          flutter test --reporter expanded > tests.txt 2>&1
          result=$?
          cat tests.txt
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Flutter test diagnostics" -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=neutral \
            -f 'output[title]=Flutter tests' -f "output[summary]=$(tail -c 50000 tests.txt)"
          exit "$result"
      - name: Build installable prototype (debug signing, not production)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          flutter build apk --release > build-log.txt 2>&1
          result=$?
          cat build-log.txt
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Android build diagnostics" -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=neutral \
            -f 'output[title]=Android build' -f "output[summary]=$(tail -c 50000 build-log.txt)"
          exit "$result"
      - name: Prepare download
        run: |
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/VisionAssist-camera-prototype.apk
          cp pubspec.lock apk/pubspec.lock
          flutter --version > apk/flutter-version.txt
          cd apk
          sha256sum VisionAssist-camera-prototype.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VisionAssist-camera-prototype
          path: apk/
          retention-days: 30
      - name: Publish downloadable prototype
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "camera-prototype-${GITHUB_RUN_NUMBER}" \
            apk/VisionAssist-camera-prototype.apk apk/SHA256SUMS.txt apk/pubspec.lock apk/flutter-version.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "VisionAssist camera prototype (build ${GITHUB_RUN_NUMBER})" \
            --notes "Installable Android camera-first prototype. Includes uploaded branding, labelled Back, camera/OCR/steps, and experimental Geoapify walking navigation with foreground voice input. Map key, internet and GPS required. Obstacle detection, model inference, automatic fall/SOS triggers, Bluetooth triple press and always-on wake word are NOT integrated into the mobile app. Backend source has separately tested mocked SMS/Qwen adapters; no live backend or message delivery is configured. Device validation remains required. Experimental, not a primary mobility aid. Uses test/debug signing, not production signing. Minimum Android API 23 or the generated Flutter minimum if higher. See README and hardware setup before use."
