plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.visionaid.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.visionaid.app"
        minSdk 26          // Android 8.0
        targetSdk 34       // Android 14
        versionCode 1
        versionName "1.0"

        vectorDrawables {
            useSupportLibrary = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        // Required so the YOLO .tflite model can be shipped in assets and
        // (optionally) consumed through ML Model Binding.
        mlModelBinding true
    }

    composeOptions {
        // Compose compiler 1.5.8 maps to Kotlin 1.9.22:
        // https://developer.android.com/jetpack/compose/compiler#kotlin-map
        kotlinCompilerExtensionVersion '1.5.8'
    }

    // TFLite models must not be compressed, otherwise they cannot be
    // memory-mapped by the TensorFlow Lite interpreter.
    aaptOptions {
        noCompress "tflite"
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    // ---------------- Core Android ----------------
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    // LifecycleService: lets our foreground services expose a LifecycleOwner
    // (required for the CameraX phone-camera fallback).
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // ---------------- Jetpack Compose ----------------
    implementation platform('androidx.compose:compose-bom:2024.01.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // ---------------- Hilt (dependency injection) ----------------
    implementation 'com.google.dagger:hilt-android:2.50'
    kapt 'com.google.dagger:hilt-compiler:2.50'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'
    // Hilt + WorkManager (automatic service restart worker)
    implementation 'androidx.hilt:hilt-work:1.1.0'
    kapt 'androidx.hilt:hilt-compiler:1.1.0'

    // ---------------- Room (local database) ----------------
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // ---------------- TensorFlow Lite (YOLOv11n inference) ----------------
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-metadata:0.4.4'

    // ONNX Runtime (alternative to TFLite - swap in if you export .onnx instead)
    // implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.16.3'

    // ---------------- Google ML Kit ----------------
    // On-device OCR (text / sign recognition)
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    // On-device object detection (optional backup to YOLO)
    implementation 'com.google.mlkit:object-detection:17.0.0'

    // ---------------- Google Generative AI (Gemini) ----------------
    // This project talks to the Gemini REST API directly via Retrofit below,
    // which gives full control over prompts, retries and error handling.
    // If you prefer the official client library, uncomment:
    // implementation 'com.google.ai.client.generativeai:generativeai:0.1.2'

    // ---------------- Retrofit + OkHttp (ESP32-CAM + Gemini REST) ----------------
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // ---------------- Coil (image loading) ----------------
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // ---------------- Location (GPS) ----------------
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // ---------------- CameraX (phone camera backup mode) ----------------
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // ---------------- Coroutines ----------------
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // Task.await() for Google Play services (FusedLocationProviderClient)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // ---------------- DataStore (settings persistence) ----------------
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // ---------------- WorkManager (background restart) ----------------
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
