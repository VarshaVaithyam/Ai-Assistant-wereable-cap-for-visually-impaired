name: vision_assist
description: Experimental accessible ESP32-CAM walking companion.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.3.0
  flutter_tts: ^4.2.2
  shared_preferences: ^2.5.2
  google_mlkit_text_recognition: ^0.15.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  pedometer: ^4.1.1
  permission_handler: ^12.0.1
  url_launcher: ^6.3.1
  geolocator: ^14.0.2
  speech_to_text: ^7.3.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  wakelock_plus: ^1.3.2
  flutter_secure_storage: ^9.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/branding/visionassist-logo.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/visionassist-logo.png
  min_sdk_android: 23
