name: visionassist
description: >
  VisionAssist - an AI-powered assistive Android application that helps blind
  and low-vision individuals navigate their surroundings through real-time
  object detection, voice-guided walking assistance, footstep counting,
  OCR-based signboard recognition, and GPS-based pedestrian navigation.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # On-device AI inference (YOLO11n TFLite)
  tflite_flutter: ^0.11.0
  image: ^4.2.0

  # Text to speech (directional voice assistance)
  flutter_tts: ^4.0.2

  # Footstep counting
  pedometer: ^4.0.2
  sensors_plus: ^6.0.1

  # GPS / pedestrian navigation
  geolocator: ^12.0.0
  vibration: ^2.0.0
  wakelock_plus: ^1.2.5

  # Voice destination search
  speech_to_text: ^6.6.2

  # OCR signboard recognition
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2

  # Networking (ESP32-CAM MJPEG stream, OSRM routing)
  http: ^1.2.1

  # Persistence
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  collection: ^1.18.0
  vector_math: ^2.1.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
